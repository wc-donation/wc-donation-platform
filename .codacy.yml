# Codacy configuration
#
# Makes the Codacy Security Scan less noisy. Low-value cosmetic checks are
# demoted via phpcs.xml (Generic.Files.LineLength and FunctionComment -> info).
# Real compile/style enforcement happens in .github/workflows/ci.yml
# (php -l, ESLint, wp-scripts build).

engines:
  duplication:
    enabled: false

  # PHP CodeSniffer uses the repo's phpcs.xml (line length relaxed to info).
  php_codesniffer:
    enabled: true

  # Keep the security-focused engines on.
  phpstan:
    enabled: true
